services:
  local-anvil-node:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: local-anvil-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545"
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--block-time", "1"]
    networks:
      - lab-net

  signing-proxy:
    build:
      context: ./projects/project1-secops-circuit-breaker/signing-proxy
      dockerfile: Dockerfile
    container_name: signing-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - RPC_URL=http://local-anvil-node:8545
      - HMAC_SHARED_SECRET=secops_auth_token_deterministic_key_2026
      - CHAIN_ID=31337
    depends_on:
      - local-anvil-node
    networks:
      - lab-net

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_dev_password_2026
      - POSTGRES_DB=web3_automation
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web3_automation"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lab-net

  mock-webhook-sink:
    build:
      context: ./projects/project2-subsync/mock-webhook-sink
      dockerfile: Dockerfile
    container_name: mock-webhook-sink
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
    networks:
      - lab-net

  n8n-orchestrator:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-orchestrator
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=web3_automation
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres_dev_password_2026
      - DB_POSTGRESDB_SCHEMA=public
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - WEBHOOK_URL=http://n8n-orchestrator:5678/
      - HMAC_SHARED_SECRET=secops_auth_token_deterministic_key_2026
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lab-net

  ops-dashboard:
    build:
      context: ./projects/ops-dashboard
      dockerfile: Dockerfile
    container_name: ops-dashboard
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_dev_password_2026
      - POSTGRES_DB=web3_automation
      - TELEGRAM_BOT_TOKEN=8661301970:AAEyGarl4xtMFrM3qnhgaB2hAOjdI1T4TNs
      - TELEGRAM_CHAT_ID=1861290667
    depends_on:
      - postgres-db
      - local-anvil-node
      - n8n-orchestrator
    networks:
      - lab-net

volumes:
  postgres_data:
  n8n_data:

networks:
  lab-net:
    driver: bridge
